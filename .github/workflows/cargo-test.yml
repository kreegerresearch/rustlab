name: cargo-test

# Full workspace test suite. The validate-notebooks workflow checks
# rendered notebook artefacts; this one runs every Rust unit and
# integration test (`cargo test --workspace --profile ci`), which CI previously
# never executed — a red test on main went unnoticed for two days
# because only notebook validation gated merges.
#
# chktex + tidy are required by rustlab-notebook's validate::tests
# (linter-wrapper self-tests). The build itself needs no -dev packages;
# minimal-linux-build.yml checks that in a bare container.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # rusqlite 0.41 (bundled SQLite) needs rustc 1.89. Stable is at
      # least that. The runner image's default toolchain may be older.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          ok=0
          for attempt in 1 2 3; do
            if sudo apt-get update -y && sudo apt-get install -y --no-install-recommends \
              chktex \
              tidy; then
              ok=1
              break
            fi
            echo "apt attempt ${attempt} failed"
            sleep 20
          done
          test "$ok" = 1

      # Restore on every run, save only from main: per-PR saves pushed the
      # repo past the 10 GB cache limit and evicted each other.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `ci` profile (workspace Cargo.toml): opt-level 2 with debug
      # assertions and overflow checks. At opt-level 0 the FDTD and
      # storage-mode tests alone took over 12 minutes. Doctests run too.
      - name: Run workspace tests
        run: cargo test --workspace --profile ci
