name: cargo-test

# Full workspace test suite. The validate-notebooks workflow checks
# rendered notebook artefacts; this one runs every Rust unit and
# integration test (`cargo test --workspace`), which CI previously
# never executed — a red test on main went unnoticed for two days
# because only notebook validation gated merges.
#
# chktex + tidy are required by rustlab-notebook's validate::tests
# (linter-wrapper self-tests); the font/pkg-config packages are
# build-time deps of rustlab-plot's SVG/PNG backends.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # rusqlite 0.41 (bundled SQLite) needs rustc 1.89. Stable is at
      # least that. The runner image's default toolchain may be older.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          ok=0
          for attempt in 1 2 3; do
            if sudo apt-get update -y && sudo apt-get install -y --no-install-recommends \
              libfontconfig1-dev \
              libfreetype-dev \
              pkg-config \
              chktex \
              tidy; then
              ok=1
              break
            fi
            echo "apt attempt ${attempt} failed"
            sleep 20
          done
          test "$ok" = 1

      - name: Cache cargo registry and build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Run workspace tests
        run: cargo test --workspace
